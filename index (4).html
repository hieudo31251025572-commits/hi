<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thần Nhỏ: Vẽ Luật</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f1eee6;--fg:#1d1b22;--card:#fff;--ac:#a8740a;--mut:#6b6676}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c0e1a;--fg:#ece9f5;--card:#171a2d;--ac:#f5c542;--mut:#9b97ad}}
:root[data-theme="dark"]{--bg:#0c0e1a;--fg:#ece9f5;--card:#171a2d;--ac:#f5c542;--mut:#9b97ad}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,"Segoe UI",sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:12px}
h1{font-size:1.15rem;margin:4px 0 8px}
.hud{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:8px;font-size:.85rem}
.bar{flex:1;min-width:110px;height:10px;background:var(--card);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0}
#xpb{background:var(--ac)}#hpb{background:#e0524d}
canvas{width:100%;height:60vh;min-height:300px;background:#080a14;border-radius:12px;display:block;touch-action:none}
button{background:var(--ac);color:#111;border:0;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer;font-size:.9rem}
button[disabled]{opacity:.5}
#laws{margin-top:10px;display:grid;gap:6px;font-size:.85rem}
.law{background:var(--card);border-radius:8px;padding:8px 10px}
.law b{color:var(--ac)}.law small{color:var(--mut);display:block}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:16px}
#modal .box{background:var(--card);border-radius:14px;padding:16px;max-width:460px;width:100%}
textarea{width:100%;height:90px;border-radius:8px;border:1px solid var(--mut);padding:8px;background:var(--bg);color:var(--fg);font:inherit;margin:8px 0}
#st{font-size:.85rem;color:var(--mut);min-height:1.2em}
</style></head><body><div class="wrap">
<h1>✦ Thần Nhỏ: Vẽ Luật</h1>
<div class="hud"><span id="lv">Cấp 1</span><div class="bar"><i id="xpb"></i></div><span>Máu</span><div class="bar"><i id="hpb"></i></div><button id="wr">Viết luật</button></div>
<canvas id="c"></canvas>
<p style="font-size:.8rem;color:var(--mut)">Di chuột / chạm để di chuyển. Nhặt quả cầu vàng để lên cấp, tránh bóng tối đỏ. Mỗi lần lên cấp, bạn được viết một luật mới cho thế giới; Thiên Đạo (AI) sẽ định cấp độ luật.</p>
<div id="laws"></div></div>
<div id="modal"><div class="box"><b id="mt">Viết luật của bạn</b>
<div style="font-size:.8rem;color:var(--mut)">Ví dụ: "Bóng tối sợ ánh sáng nên chạy chậm lại", "Ai cũng nhẹ như gió"…</div>
<textarea id="tx" maxlength="200" placeholder="Luật của thế giới này là…"></textarea>
<div id="st"></div><button id="ok">Ban hành luật</button></div></div>
<script>
const cv=document.getElementById('c'),cx=cv.getContext('2d');
let W=0,H=0;function rs(){const r=cv.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;cx.setTransform(d,0,0,d,0,0);W=r.width;H=r.height}
addEventListener('resize',rs);rs();
const $=id=>document.getElementById(id);
let laws=[];try{laws=JSON.parse(localStorage.getItem('laws')||'[]')}catch(e){}
let lvl=1+Math.floor(laws.length*0),xp=0,pending=1,hp=100,t=0,over=false,paused=false;
lvl=Math.max(1,laws.length+1);pending=laws.length?0:1;
const P={x:300,y:200},M={x:300,y:200};let orbs=[],en=[],acc=0;
const need=()=>5+lvl*5;
const FX={magnet:'Hút ánh sáng',speed:'Tăng tốc',shield:'Giáp',slow:'Làm chậm bóng tối',regen:'Hồi sinh khí',xp:'Khai sáng'};
function fx(){const f={mag:50,spd:1,sh:1,sl:1,rg:0,xp:1};laws.forEach(l=>{const n=l.level;
if(l.effect=='magnet')f.mag+=45*n;if(l.effect=='speed')f.spd+=.12*n;if(l.effect=='shield')f.sh*=Math.max(.2,1-.12*n);
if(l.effect=='slow')f.sl*=Math.max(.25,1-.1*n);if(l.effect=='regen')f.rg+=.8*n;if(l.effect=='xp')f.xp+=.25*n});return f}
function renderLaws(){$('laws').innerHTML='';laws.forEach(l=>{const d=document.createElement('div');d.className='law';
const b=document.createElement('b');b.textContent=l.name+' · cấp '+l.level+' · '+(FX[l.effect]||'');
const s=document.createElement('small');s.textContent='“'+l.text+'” — '+l.lore;d.append(b,s);$('laws').append(d)})}
function hud(){$('lv').textContent='Cấp '+lvl;$('xpb').style.width=Math.min(100,xp/need()*100)+'%';$('hpb').style.width=Math.max(0,hp)+'%';$('wr').disabled=pending<1}
function spawnOrb(){orbs.push({x:20+Math.random()*(W-40),y:20+Math.random()*(H-40)})}
function spawnEn(){const s=Math.floor(Math.random()*4),r=12;let x,y;
if(s==0){x=-r;y=Math.random()*H}else if(s==1){x=W+r;y=Math.random()*H}else if(s==2){x=Math.random()*W;y=-r}else{x=Math.random()*W;y=H+r}en.push({x,y})}
function reset(){hp=100;t=0;en=[];orbs=[];xp=0;over=false;P.x=W/2;P.y=H/2;M.x=P.x;M.y=P.y;for(let i=0;i<8;i++)spawnOrb();hud()}
function openModal(){paused=true;$('mt').textContent='Viết luật của bạn (tối đa cấp '+lvl+')';$('st').textContent='';$('tx').value='';$('ok').disabled=false;$('modal').style.display='flex'}
$('wr').onclick=()=>{if(pending>0)openModal()};
function localJudge(text,max){const m=[[/hút|nam châm|thu hút|gọi/i,'magnet'],[/nhanh|chạy|gió|bay|tốc/i,'speed'],[/khiên|bảo vệ|giáp|bất tử|cứng/i,'shield'],[/chậm|băng|đóng|sợ|ngủ/i,'slow'],[/hồi|máu|chữa|sống|mầm/i,'regen'],[/học|sáng|kinh nghiệm|khôn|trí/i,'xp']];
let e=(m.find(r=>r[0].test(text))||[0,['magnet','speed','shield','slow','regen','xp'][Math.floor(Math.random()*6)]])[1];
return{name:text.slice(0,24),effect:e,level:Math.min(max,1+Math.floor(text.length/30)),lore:'Thiên Đạo lặng lẽ gật đầu.'}}
const JUDGE_URL='/judge'; // cùng domain với server Render nên không cần dán URL
async function judge(text,max){
if(JUDGE_URL){try{const r=await fetch(JUDGE_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,max}),signal:AbortSignal.timeout(25000)});
if(r.ok){const j=await r.json();if(FX[j.effect]){j.level=Math.max(1,Math.min(max,j.level|0||1));return j}}}catch(e){}}
try{const s=window.claude?await claude.use('sample'):null;if(!s)return localJudge(text,max);
const p='Bạn là Thiên Đạo, trọng tài của một thế giới mới sinh. Một vị thần cấp '+max+' viết luật: "'+text.replace(/"/g,"'")+'".\nChọn đúng một effect trong: magnet, speed, shield, slow, regen, xp (gần nghĩa nhất với luật). Định cấp độ luật từ 1 đến '+max+': luật sáng tạo, có thi vị, cân bằng thì cấp cao; luật nhàm, vô nghĩa hay lười thì cấp 1. Không vượt quá '+max+'.\nChỉ trả JSON: {"name":"tên luật ngắn tiếng Việt","effect":"...","level":số,"lore":"một câu bình của Thiên Đạo"}';
const r=await s(p,{modelTier:'quick',cache:false});const j=JSON.parse(r.text.match(/\{[\s\S]*\}/)[0]);
if(!FX[j.effect])throw 0;j.level=Math.max(1,Math.min(max,Math.round(+j.level)||1));j.name=String(j.name||text).slice(0,40);j.lore=String(j.lore||'');return j}
catch(e){return localJudge(text,max)}}
$('ok').onclick=async()=>{const text=$('tx').value.trim();if(!text)return;$('ok').disabled=true;$('st').textContent='Thiên Đạo đang cân nhắc…';
const j=await judge(text,lvl);j.text=text;laws.push(j);try{localStorage.setItem('laws',JSON.stringify(laws))}catch(e){}
pending--;renderLaws();hud();$('modal').style.display='none';paused=false};
function mv(e){const r=cv.getBoundingClientRect(),q=e.touches?e.touches[0]:e;M.x=q.clientX-r.left;M.y=q.clientY-r.top}
cv.addEventListener('pointermove',mv);cv.addEventListener('pointerdown',mv);
let last=performance.now();
function tick(n){const dt=Math.min(.05,(n-last)/1000);last=n;requestAnimationFrame(tick);
if(!paused&&!over){const f=fx();t+=dt;
let dx=M.x-P.x,dy=M.y-P.y,d=Math.hypot(dx,dy);if(d>6){const v=min(170*f.spd,d*6);P.x+=dx/d*v*dt;P.y+=dy/d*v*dt}
acc+=dt;if(acc>Math.max(.45,1.8-t/50)&&en.length<45){acc=0;spawnEn()}
if(orbs.length<8)spawnOrb();
orbs=orbs.filter(o=>{const q=Math.hypot(o.x-P.x,o.y-P.y);if(q<f.mag&&q>1){o.x+=(P.x-o.x)/q*120*dt;o.y+=(P.y-o.y)/q*120*dt}
if(q<16){xp+=1*f.xp;return false}return true});
if(xp>=need()){xp-=need();lvl++;pending++;hud();openModal()}
let hit=0;en.forEach(e=>{const q=Math.hypot(P.x-e.x,P.y-e.y)||1,s=(40+t*.6)*f.sl;e.x+=(P.x-e.x)/q*s*dt;e.y+=(P.y-e.y)/q*s*dt;if(q<18)hit++});
hp=Math.min(100,hp+f.rg*dt)-hit*22*f.sh*dt;
if(hp<=0){over=true;hp=0}hud()}
draw()}
function min(a,b){return a<b?a:b}
function draw(){cx.clearRect(0,0,W,H);cx.strokeStyle='#ffffff10';for(let x=0;x<W;x+=40){cx.beginPath();cx.moveTo(x,0);cx.lineTo(x,H);cx.stroke()}for(let y=0;y<H;y+=40){cx.beginPath();cx.moveTo(0,y);cx.lineTo(W,y);cx.stroke()}
const f=fx();cx.strokeStyle='#5ee0ff33';cx.beginPath();cx.arc(P.x,P.y,f.mag,0,7);cx.stroke();
cx.fillStyle='#f5c542';orbs.forEach(o=>{cx.beginPath();cx.arc(o.x,o.y,5,0,7);cx.fill()});
cx.fillStyle='#e0524d';en.forEach(e=>{cx.beginPath();cx.arc(e.x,e.y,11,0,7);cx.fill()});
cx.fillStyle='#5ee0ff';cx.shadowColor='#5ee0ff';cx.shadowBlur=18;cx.beginPath();cx.arc(P.x,P.y,10,0,7);cx.fill();cx.shadowBlur=0;
if(over){cx.fillStyle='#000a';cx.fillRect(0,0,W,H);cx.fillStyle='#fff';cx.textAlign='center';cx.font='bold 22px system-ui';
cx.fillText('Bóng tối nuốt chửng bạn… nhưng luật vẫn còn.',W/2,H/2-10);cx.font='15px system-ui';cx.fillText('Chạm để sống lại (đạt cấp '+lvl+', sống '+Math.floor(t)+'s)',W/2,H/2+18)}}
cv.addEventListener('click',()=>{if(over)reset()});
renderLaws();reset();if(pending)openModal();requestAnimationFrame(tick);
</script></body></html>
